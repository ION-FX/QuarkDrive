<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared — Quarkdrive</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌌</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="public-view" class="view">
  <header class="topbar panel">
    <div class="brand-small">
      <span class="brand-mark">🌌</span>
      <span>Quarkdrive</span>
    </div>
    <span id="pub-title" class="muted">Shared with you</span>
  </header>

  <div class="pane">
    <div id="pub-password" class="login-card panel" hidden>
      <p style="margin:0 0 10px">This link is protected. Enter its password.</p>
      <input id="pub-pass" type="password" placeholder="Password" autocomplete="off">
      <button id="pub-unlock" class="primary">Open</button>
      <p id="pub-error" class="error" role="alert" hidden></p>
    </div>

    <div id="pub-file" class="panel" hidden style="padding:16px; display:flex; gap:12px; align-items:center">
      <span id="pub-file-name"></span>
      <button id="pub-download" class="primary">Download</button>
    </div>

    <ul id="pub-list" class="entry-list" aria-live="polite"></ul>
    <p id="pub-status" class="muted" style="padding:12px" hidden></p>
  </div>
</section>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="public.js"></script>
</body>
</html>
