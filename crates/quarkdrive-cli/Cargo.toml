[package]
name = "quarkdrive-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Quarkdrive command line client and sync daemon"

[[bin]]
name = "qd"
path = "src/main.rs"

[dependencies]
quarkdrive-core = { path = "../quarkdrive-core" }

clap = { version = "4.4", features = ["derive"] }
notify = "6.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.9"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
quarkdrive-core = { path = "../quarkdrive-core", features = ["testing"] }
